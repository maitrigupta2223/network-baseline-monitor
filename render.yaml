services:
  - type: web
    name: network-baseline-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --access-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      # PORT is set automatically by Render
